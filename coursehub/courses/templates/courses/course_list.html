<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kursy</title>
</head>
<body>
<h1>Dostępne Kursy</h1>

{% for course in courses %}
    <article>
        <h2>{{ course.title|upper }}</h2>
        <p>{{ course.description|truncatewords:20 }}</p>
        <p>{{ course.price }}</p>
        <p>{{ course.trainer }}</p>
        <p>{{ course.start_date }}</p>
    </article>
{% empty %}
    <p>Brak kursów.</p>
{% endfor %}

</body>
</html>
