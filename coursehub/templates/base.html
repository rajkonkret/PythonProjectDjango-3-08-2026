{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CorseHub{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'courses/style.css' %}">
</head>
<body>
<nav>
    <a href="{% url 'courses:home' %}">Start</a>
    <a href="{% url 'courses:course_list' %}">Kursy</a>
    <a href="{% url 'api_placeholder' %}">API</a>
</nav>

<main>
    {% if messages %}
        {% for message in messages %}
            <div>{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
